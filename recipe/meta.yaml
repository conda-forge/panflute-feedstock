{% set name = "panflute" %}
{% set version = "3.0.0" %}
# inclusive
{% set pandoc_minimum_version = "2.11.0.4" %}
# exclusive
{% set pandoc_maximum_version = "4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/panflute-{{ version }}.tar.gz
  sha256: 7933538a1744f434be2d88a6284ddcc653642aa2f4d1f8136a56f63dcb25af2a

build:
  number: 0
  noarch: python
  entry_points:
    - panflute=panflute:main
    - panfl=panflute:panfl
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - click >=6,<9
    - pyyaml >=3,<7
  run_constrained:
    - pandoc >={{ pandoc_minimum_version }},<{{ pandoc_maximum_version }}

test:
  imports:
    - panflute
  commands:
    - pip check
    - |
      echo '# Testing' | pandoc -F panflute 
    - panfl --help
  requires:
    - python {{ python_min }}
    - pip
    - pandoc >={{ pandoc_minimum_version }},<{{ pandoc_maximum_version }}

about:
  home: https://github.com/sergiocorreia/panflute
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Pythonic Pandoc filters
  doc_url: http://scorreia.com/software/panflute/
  dev_url: https://github.com/sergiocorreia/panflute

extra:
  recipe-maintainers:
    - ickc
    - kiwi0fruit
